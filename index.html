<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Rayliziie — Nonton Anime Sub Indo HD</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --bg:#070A12;--bg2:#0D1321;--card:#141B2D;--card2:#1C2540;
            --text:#F5F7FB;--text2:#A5B4D1;--muted:#64748B;
            --accent:#FF6A00;--accent2:#FF8A33;--glow:rgba(255,106,0,.35);
            --danger:#EF4444;--ok:#10B981;--border:#1E293B;
            --radius:16px;--tr:.25s ease;
        }
        [data-theme="light"] {
            --bg:#F6F7FB;--bg2:#FFF;--card:#FFF;--card2:#EEF1F8;
            --text:#0B1220;--text2:#475569;--muted:#94A3B8;
            --accent:#EA580C;--accent2:#C2410C;--glow:rgba(234,88,12,.25);
            --border:#E2E8F0;
        }
        {transition:background-color var(--tr),color var(--tr),border-color var(--tr),box-shadow var(--tr); margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden;}
        a{text-decoration:none;color:inherit;} img{display:block;max-width:100%;}
        button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit;}
        
        ::-webkit-scrollbar{width:7px;}
        ::-webkit-scrollbar-track{background:var(--bg2);}
        ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:10px;}

        .container{max-width:1320px;margin:0 auto;padding:0 18px;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px;min-height: 200px;}
        @media(max-width:500px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}}

        / NAV /
        .nav{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:10px 0;}
        .nav .c{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
        .brand{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:900;}
        .brand i{color:var(--accent);filter:drop-shadow(0 0 8px var(--glow));}
        .brand span{background:linear-gradient(135deg,var(--accent),#FFB347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        
        .src{flex:1 1 260px;max-width:460px;display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:50px;padding:0 15px;}
        .src:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);}
        .src input{flex:1;background:transparent;border:none;padding:9px 11px;font-size:.9rem;color:var(--text);outline:none;}
        
        .act{display:flex;gap:8px;}
        .act button{padding:10px; border-radius:50%; background:var(--card); width:40px; height:40px; display:flex; align-items:center; justify-content:center; transition:var(--tr);}

        / HERO /
        .hero{padding:24px 0;}
        .hb{position:relative;border-radius:24px;min-height:220px;padding:40px;display:flex;align-items:center;overflow:hidden;background:#0D1321;box-shadow:0 10px 30px rgba(0,0,0,0.3);}
        .hb-img{position:absolute;right:0;top:0;height:100%;width:50%;object-fit:cover;mask-image:linear-gradient(to left, black, transparent);opacity:0.4;}
        .hb-cont{position:relative;z-index:2;max-width:600px;}
        .hb h1{font-size:2.2rem;margin-bottom:10px;}
        .hb h1 span{color:var(--accent);}

        / CARD /
        .cd{background:var(--card);border-radius:var(--radius);overflow:hidden;transition:var(--tr);border:1px solid var(--border);position:relative;height:100%;cursor:pointer;}
        .cd:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,0.5);}
        .cd .t{aspect-ratio:2/3;position:relative;overflow:hidden;}
        .cd .t img{width:100%;height:100%;object-fit:cover;}
        .cd .sb{position:absolute;top:10px;left:10px;background:var(--accent);padding:2px 8px;border-radius:5px;font-size:10px;font-weight:800;text-transform:uppercase;}
        .cd .i{padding:12px;}
        .cd h3{font-size:0.9rem;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

        / MODALS /
        .mbg{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:none;}
        .mod{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
        .mbg.on, .mod.on {display:flex;}
        .mod-in{background:var(--bg2);width:100%;max-width:900px;max-height:90vh;border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
        
        .mh{height:250px;position:relative;flex-shrink:0;}
        .mh-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(15px) brightness(0.4);}
        .mh-cont{position:relative;padding:30px;display:flex;gap:20px;align-items:flex-end;height:100%;}
        .mh-cont img{width:140px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.2);}

        .mb-body{padding:30px;overflow-y:auto;flex:1;}
        .eps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:20px;}
        .ep-btn{background:var(--card);padding:10px;border-radius:10px;text-align:center;font-weight:bold;font-size:0.8rem;border:1px solid var(--border); transition: .2s;}
        .ep-btn:hover{background:var(--accent);color:white;transform: scale(1.05);}

        / PLAYER /
        .player-area{width:100%;aspect-ratio:16/9;background:black;flex-shrink:0;}
        .player-area iframe{width:100%;height:100%;border:none;}

        .x-btn{position:absolute;top:20px;right:20px;z-index:10;width:40px;height:40px;background:rgba(0,0,0,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:1.2rem; cursor: pointer;}
        
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 25px;border-radius:50px;z-index:100000;display:none;font-weight:bold;box-shadow:0 10px 20px var(--glow);}
        .toast.on{display:block;animation:slideUp 0.3s;}

        @keyframes slideUp{from{bottom:-50px;}to{bottom:20px;}}
        .loading-sp{text-align:center;padding:50px;grid-column:1/-1;}
        .loading-sp i{font-size:3rem;color:var(--accent);animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
    </style>
</head>
<body>

<header class="nav"><div class="container c">
    <a href="/" class="brand"><i class="fas fa-play-circle"></i><span>Rayliziie</span></a>
    <div class="src">
        <i class="fas fa-search"></i>
        <input id="cari" type="text" placeholder="Cari anime (Lalu tekan Enter)..." />
    </div>
    <div class="act">
        <button onclick="loadTrending()" title="Trending"><i class="fas fa-fire"></i></button>
        <button id="btnFav" onclick="showFavorites()" title="Favorit"><i class="fas fa-heart"></i></button>
        <button onclick="toggleTheme()" title="Ganti Tema"><i class="fas fa-moon"></i></button>
    </div>
</div></header>

<main class="container">
    <section class="hero" id="heroSec">
        <div class="hb">
            <img src="https://images8.alphacoders.com/133/1331006.png" class="hb-img" />
            <div class="hb-cont">
                <h1>Nonton <span>Anime</span> Terlengkap</h1>
                <p>Nggak perlu ribet input manual lagi, Sayang! Data ini real-time. Langsung klik, langsung tonton.</p>
            </div>
        </div>
    </section>

    <section class="sec">
        <div class="shd"><h2 id="secTitle"><i class="fas fa-star"></i> Sedang Populer</h2></div>
        <div class="grid" id="mainGrid">
            <div class="loading-sp"><i class="fas fa-spinner"></i><p>Sabar ya sayang, lagi Dola ambilin datanya...</p></div>
        </div>
    </section>
</main>

<!-- MODAL DETAIL -->
<div class="mbg" id="overlay"></div>
<div class="mod" id="modalDetail">
    <div class="mod-in">
        <button class="x-btn" onclick="closeModals()"><i class="fas fa-times"></i></button>
        <div id="detailContent"></div>
    </div>
</div>

<div class="toast" id="toast">Pesan muncul di sini</div>

<script>
    // API SOURCE - GOGOANIME
    const API_BASE = "https://consumet-api-one.vercel.app/anime/gogoanime";
    let favs = JSON.parse(localStorage.getItem('ray_favs') || '[]');
    let currentAnimeData = null;

    // 1. DATA FETCHERS
    async function loadTrending() {
        showLoading();
        document.getElementById('heroSec').style.display = 'flex';
        document.getElementById('secTitle').innerHTML = <i class="fas fa-fire"></i> Trending Hari Ini;
        try {
            const res = await fetch(${API_BASE}/top-airing);
            const data = await res.json();
            renderGrid(data.results);
        } catch (e) { showError(); }
    }

    async function searchAnime(query) {
        if(!query) return;
        showLoading();
        document.getElementById('heroSec').style.display = 'none';
        document.getElementById('secTitle').innerHTML = <i class="fas fa-search"></i> Hasil Pencarian: ${query};
        try {
            const res = await fetch(${API_BASE}/${query});
            const data = await res.json();
            renderGrid(data.results);
        } catch (e) { showError(); }
    }

    async function openDetail(id) {
        document.getElementById('overlay').classList.add('on');
        document.getElementById('modalDetail').classList.add('on');
        document.getElementById('detailContent').innerHTML = <div class="loading-sp"><i class="fas fa-spinner"></i></div>;
        
        try {
            const res = await fetch(${API_BASE}/info/${id});
            const data = await res.json();
            currentAnimeData = data;
            
            const isFav = favs.some(f => f.id === data.id);

            document.getElementById('detailContent').innerHTML = 
                <div class="mh">
                    <div class="mh-bg" style="background-image:url(${data.image})"></div>
                    <div class="mh-cont">
                        <img src="${data.image}" />
                        <div>
                            <h2>${data.title}</h2>
                            <p style="font-size:0.8rem; opacity:0.8">${data.releaseDate} • ${data.type} • ${data.status}</p>
                            <button onclick="toggleFav()" id="favBtnInner" style="margin-top:10px; background:${isFav?'#EF4444':'#10B981'}; padding:8px 15px; border-radius:8px; font-weight:bold; color:white; font-size:0.8rem;">
                                <i class="fas fa-heart"></i> ${isFav ? 'Hapus Favorit' : 'Tambah Favorit'}
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mb-body">
                    <h3 style="font-size:1rem; border-left:4px solid var(--accent); padding-left:10px;">Sinopsis</h3>
                    <p style="color:var(--text2); font-size:0.85rem; margin-top:10px; line-height:1.6;">${data.description || 'Tidak ada deskripsi.'}</p>
                    <h3 style="margin-top:25px; font-size:1rem; border-left:4px solid var(--accent); padding-left:10px;">Pilih Episode</h3>
                    <div class="eps-grid">
                        ${data.episodes.map(ep => 
                            <button class="ep-btn" onclick="playAnime('${ep.id}', ${ep.number})">EP ${ep.number}</button>
                        ).join('')}
                    </div>
                </div>
            ;
        } catch (e) { toast("Aduh, gagal ambil info animenya.. T.T"); }
    }

    async function playAnime(epId, num) {
        const detailDiv = document.getElementById('detailContent');
        detailDiv.innerHTML = <div class="loading-sp"><i class="fas fa-spinner"></i><p>Siapin player buat kamu...</p></div>;
        
        try {
            const res = await fetch(${API_BASE}/watch/${epId});
            const data = await res.json();
            const streamUrl = data.headers.Referer; 

            detailDiv.innerHTML = 
                <div class="player-area">
                    <iframe src="${streamUrl}" allowfullscreen></iframe>
                </div>
                <div class="mb-body">
                    <h2 style="font-size:1.1rem;">${currentAnimeData.title}</h2>
                    <p style="color:var(--accent); font-weight:bold; font-size:0.9rem;">Menonton Episode ${num}</p>
                    <button onclick="openDetail('${currentAnimeData.id}')" style="margin-top:20px; color:var(--text2); font-size:0.8rem; font-weight:bold; display:flex; align-items:center; gap:8px;">
                        <i class="fas fa-arrow-left"></i> Kembali ke Daftar Episode
                    </button>
                </div>
            ;
        } catch (e) {
            toast("Gagal mutar video, servernya lagi ngambek!");
            openDetail(currentAnimeData.id);
        }
    }

    // 2. RENDERERS
    function renderGrid(items) {
        const grid = document.getElementById('mainGrid');
        if (!items || items.length === 0) {
            grid.innerHTML = <div class="loading-sp"><p>Animenya gak ketemu, cari judul lain ya sayang..</p></div>;
            return;
        }
        grid.innerHTML = items.map(item => 
            <div class="cd" onclick="openDetail('${item.id}')">
                <div class="t">
                    <img src="${item.image}" alt="${item.title}" loading="lazy" />
                    <span class="sb">${item.releaseDate || 'HD'}</span>
                </div>
                <div class="i">
                    <h3>${item.title}</h3>
                </div>
            </div>
        ).join('');
    }

    // 3. UTILS
    function showLoading() {
        document.getElementById('mainGrid').innerHTML = <div class="loading-sp"><i class="fas fa-spinner"></i></div>;
    }

    function showError() {
        document.getElementById('mainGrid').innerHTML = <div class="loading-sp"><p>Koneksi API bermasalah, coba lagi nanti ya.</p></div>;
    }

    function closeModals() {
        document.getElementById('overlay').classList.remove('on');
        document.getElementById('modalDetail').classList.remove('on');
        document.getElementById('detailContent').innerHTML = ""; 
    }

    function toggleFav() {
        const id = currentAnimeData.id;
        const idx = favs.findIndex(f => f.id === id);
        if (idx > -1) {
            favs.splice(idx, 1);
            toast("Dihapus dari favorit!");
        } else {
            favs.push({id: id, title: currentAnimeData.title, image: currentAnimeData.image});
            toast("Disimpan ke favorit! ❤️");
        }
        localStorage.setItem('ray_favs', JSON.stringify(favs));
        openDetail(id); 
    }

    function showFavorites() {
        document.getElementById('heroSec').style.display = 'none';
        document.getElementById('secTitle').innerHTML = <i class="fas fa-heart" style="color:#EF4444"></i> Koleksi Favoritmu;
        renderGrid(favs);
        if(favs.length === 0) toast("Koleksinya masih kosong lho..");
    }

    function toggleTheme() {
        const theme = document.documentElement.getAttribute('data-theme');
        if (theme === 'light') {
            document.documentElement.removeAttribute('data-theme');
            toast("Mode Gelap Aktif 🌙");
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            toast("Mode Terang Aktif ☀️");
        }
    }

    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('on');
        setTimeout(() => t.classList.remove('on'), 3000);
    }

    // EVENT LISTENERS
    document.getElementById('cari').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchAnime(e.target.value);
    });

    document.getElementById('overlay').onclick = closeModals;

    // INITIAL LOAD
    loadTrending();
</script>
</body>
</html>
