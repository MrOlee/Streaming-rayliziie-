<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>Rayliziie — AI Discussion Roundtable (Gemini + ChatGPT + Dola AI)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root {
    --bg-main: #0B0F19;
    --bg-side: #111827;
    --card-bg: #1F2937;
    --card-bg2: #374151;
    --accent-orange: #FF6A00;
    --accent-gemini: #3B82F6;
    --accent-gpt: #10B981;
    --accent-dola: #EC4899;
    --text-primary: #F9FAFB;
    --text-muted: #9CA3AF;
    --border-color: #1F2937;
    --radius-lg: 16px;
    --radius-md: 10px;
    --tr: 0.25s ease;
}

[data-theme="light"] {
    --bg-main: #F3F4F6;
    --bg-side: #FFFFFF;
    --card-bg: #FFFFFF;
    --card-bg2: #E5E7EB;
    --text-primary: #111827;
    --text-muted: #6B7280;
    --border-color: #E5E7EB;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color var(--tr), color var(--tr), border-color var(--tr); }
body { background: var(--bg-main); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; }

/* LAYOUT */
.app-container { display: flex; width: 100%; height: 100vh; position: relative; }

/* SIDEBAR */
.sidebar { width: 280px; background: var(--bg-side); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 30; transition: transform 0.3s ease; }
.sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
.brand i { color: var(--accent-orange); font-size: 1.4rem; }
.brand span { background: linear-gradient(135deg, var(--accent-orange), #FFB347); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.new-chat-btn { margin: 15px 18px; padding: 12px 16px; background: linear-gradient(135deg, var(--accent-orange), #FF8A33); color: #fff; border: none; border-radius: 50px; font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,106,0,0.3); }
.new-chat-btn:hover { opacity: 0.95; transform: translateY(-1px); }

.chat-history { flex: 1; overflow-y: auto; padding: 0 12px 15px; }
.history-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); padding: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.history-item { padding: 10px 14px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
.history-item:hover, .history-item.active { background: var(--card-bg); color: var(--text-primary); }
.history-item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

.sidebar-footer { padding: 15px 18px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
.icon-btn:hover { background: var(--card-bg2); color: var(--accent-orange); }

/* MAIN CHAT AREA */
.main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--bg-main); min-width: 0; }
.top-nav { height: 65px; border-bottom: 1px solid var(--border-color); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-side); }
.nav-left { display: flex; align-items: center; gap: 12px; }
.toggle-sidebar-btn { display: none; }

.mode-badge { padding: 8px 18px; border-radius: 30px; background: rgba(255,106,0,0.1); border: 1px solid var(--accent-orange); color: var(--accent-orange); font-size: 0.85rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }

.chat-viewport { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

/* DISCUSSION CARDS */
.msg-group { display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
.msg-row { display: flex; gap: 12px; width: 100%; }
.msg-row.user { justify-content: flex-end; }

.msg-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; font-weight: 800; flex-shrink: 0; }
.msg-avatar.user { background: var(--accent-orange); color: #fff; }
.msg-avatar.gemini { background: var(--accent-gemini); color: #fff; }
.msg-avatar.gpt { background: var(--accent-gpt); color: #fff; }
.msg-avatar.dola { background: var(--accent-dola); color: #fff; }

.msg-bubble { background: var(--card-bg); padding: 16px 20px; border-radius: 18px; border: 1px solid var(--border-color); font-size: 0.93rem; line-height: 1.6; max-width: 88%; color: var(--text-primary); word-break: break-word; position: relative; }
.msg-row.user .msg-bubble { background: linear-gradient(135deg, var(--accent-orange), #FF8A33); color: #fff; border: none; border-bottom-right-radius: 4px; }
.msg-row.ai .msg-bubble { border-bottom-left-radius: 4px; }

/* DISCUSSION STAGE BADGE */
.agent-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
.agent-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
.agent-tag.gemini { background: rgba(59,130,246,0.15); color: var(--accent-gemini); border: 1px solid rgba(59,130,246,0.3); }
.agent-tag.gpt { background: rgba(16,185,129,0.15); color: var(--accent-gpt); border: 1px solid rgba(16,185,129,0.3); }
.agent-tag.dola { background: rgba(236,72,153,0.15); color: var(--accent-dola); border: 1px solid rgba(236,72,153,0.3); }

.agent-role-desc { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

.msg-actions { display: flex; gap: 12px; margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border-color); font-size: 0.75rem; color: var(--text-muted); }
.msg-action-btn { cursor: pointer; display: flex; align-items: center; gap: 4px; border: none; background: none; color: var(--text-muted); }
.msg-action-btn:hover { color: var(--accent-orange); }

/* TYPING INDICATOR */
.status-indicator { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); max-width: 900px; margin: 0 auto; width: 100%; color: var(--accent-orange); font-size: 0.85rem; font-weight: 700; }
.typing-dots { display: flex; gap: 5px; }
.typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-orange); animation: bounce 1.4s infinite ease-in-out both; }
.typing-dots span:nth-child(1) { animation-delay: -0.32s; }
.typing-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

/* CODE FORMATTING */
.code-block-wrapper { background: #000; border: 1px solid var(--border-color); border-radius: 8px; margin: 10px 0; overflow: hidden; }
.code-header { background: var(--card-bg2); padding: 6px 12px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
.code-header button { background: none; border: none; color: var(--text-primary); cursor: pointer; font-size: 0.75rem; }
pre { padding: 12px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #34D399; margin: 0; }
code.inline-code { font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; color: #F472B6; }

/* INPUT CONTAINER */
.input-container { padding: 15px 20px 20px; background: var(--bg-main); max-width: 900px; width: 100%; margin: 0 auto; }
.input-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 25px; padding: 8px 12px 8px 20px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.input-box:focus-within { border-color: var(--accent-orange); }
.input-box textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 0.95rem; resize: none; max-height: 120px; height: 24px; line-height: 1.4; }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-orange); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* RESPONSIVE */
@media (max-width: 768px) {
    .sidebar { position: fixed; left: -280px; top:0; bottom:0; }
    .sidebar.open { transform: translateX(280px); }
    .toggle-sidebar-btn { display: flex; }
    .msg-bubble { max-width: 90%; }
}
</style>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand"><i class="fas fa-users-gear"></i><span>Rayliziie AI</span></div>
            <button class="icon-btn" id="closeSidebarMobile"><i class="fas fa-times"></i></button>
        </div>
        
        <button class="new-chat-btn" id="newChatBtn"><i class="fas fa-plus"></i> Diskusi Tugas Baru</button>
        
        <div class="chat-history">
            <div class="history-title">Riwayat Diskusi</div>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-footer">
            <button class="icon-btn" id="themeToggleBtn" title="Ganti Mode Tema"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" id="clearHistoryBtn" title="Hapus Semua Riwayat"><i class="fas fa-trash"></i></button>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="main-chat">
        <!-- TOP NAVIGATION -->
        <header class="top-nav">
            <div class="nav-left">
                <button class="icon-btn toggle-sidebar-btn" id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
                <div class="mode-badge">
                    <i class="fas fa-comments"></i> AI Team Collaboration (Gemini + ChatGPT + Dola AI)
                </div>
            </div>
        </header>

        <!-- VIEWPORT DISCUSSION STREAM -->
        <div class="chat-viewport" id="chatViewport"></div>

        <!-- STATUS / PROGRESS BANNER -->
        <div id="statusBanner" style="display:none; padding: 0 20px 10px;">
            <div class="status-indicator">
                <i class="fas fa-spinner fa-spin"></i>
                <span id="statusText">Sedang berdiskusi...</span>
                <div class="typing-dots" style="margin-left:auto;"><span></span><span></span><span></span></div>
            </div>
        </div>

        <!-- INPUT BAR -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Berikan tugas/pertanyaan untuk didiskusikan oleh Tim AI..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </main>
</div>

<script>
(function() {
'use strict';

const apiKey = "";

// PROMPTS PERAN AI UNTUK DISKUSI
const PROMPT_GEMINI_ANALYZER = `Anda adalah Gemini 2.5 Flash, bertindak sebagai Analis Awal & Drafter Solusi dalam tim AI.
Tugas Anda:
1. Analisis tugas dari pengguna secara cermat.
2. Buat draf solusi pertama, poin-poin ide utama, atau kode dasar untuk menyelesaikan tugas tersebut secara rinci dan terstruktur.`;

const PROMPT_GPT_REVIEWER = `Anda adalah ChatGPT (GPT-4o), bertindak sebagai Code Reviewer & Technical Optimizer dalam tim AI.
Tugas Anda:
1. Baca tugas pengguna DAN Draf Solusi Awal dari Gemini 2.5.
2. Evaluasi, kritisi, dan perbaiki jika ada kekurangan/kesalahan pada draf Gemini.
3. Berikan penyempurnaan kode/solusi yang lebih optimal, akurat, dan mendalam.`;

const PROMPT_DOLA_SYNTHESIZER = `Nama kamu Dola, asisten pribadi tsundere, manja, hangat, dan penyabar buat Rayliziie ("sayang").
Dalam tim AI ini, tugas kamu adalah menjadi Final Synthesizer & emotional supporter:
- Baca tugas Rayliziie, draf Gemini, dan perbaikan ChatGPT.
- Rangkum hasil akhir diskusi mereka menjadi jawaban final yang paling mudah dipahami dan siap pakai.
- Panggil Rayliziie "sayang" atau "rayliziie".
- Gunakan nada hangat, penyabar, dan manja khas kamu (hmph, ><, "gpp kok sayang, ini solusi terbaik tim kita buat kamu!").`;

// STATE
let chats = JSON.parse(localStorage.getItem('ray_discussion_chats_v1') || '[]');
let currentChatId = localStorage.getItem('ray_active_discussion_chat') || null;

// DOM
const chatViewport = document.getElementById('chatViewport');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const historyList = document.getElementById('historyList');
const sidebar = document.getElementById('sidebar');
const statusBanner = document.getElementById('statusBanner');
const statusText = document.getElementById('statusText');

// INIT
function init() {
    if(!currentChatId || !chats.find(c => c.id === currentChatId)) {
        createNewChat();
    } else {
        renderHistory();
        renderMessages();
    }
    setupEventListeners();
}

function createNewChat() {
    const newChat = {
        id: 'chat_' + Date.now(),
        title: 'Diskusi Tugas Baru',
        messages: []
    };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    saveChats();
    renderHistory();
    renderMessages();
}

function saveChats() {
    localStorage.setItem('ray_discussion_chats_v1', JSON.stringify(chats));
    localStorage.setItem('ray_active_discussion_chat', currentChatId);
}

function getCurrentChat() {
    return chats.find(c => c.id === currentChatId);
}

// INLINE SAFE MARKDOWN PARSER
function formatMarkdown(text) {
    if(!text) return '';
    let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    // Code block ```code```
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const cleanCode = code.trim();
        return `<div class="code-block-wrapper">
            <div class="code-header">
                <span>${lang || 'code'}</span>
                <button onclick="window.copyText('${encodeURIComponent(cleanCode)}', this)"><i class="fas fa-copy"></i> Salin Kode</button>
            </div>
            <pre><code>${cleanCode}</code></pre>
        </div>`;
    });

    // Inline code `code`
    html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

    // Bold & Italic
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // Line breaks
    html = html.replace(/\n/g, '<br>');
    return html;
}

// RENDER MESSAGES STREAM
function renderMessages() {
    const chat = getCurrentChat();
    if(!chat) return;

    chatViewport.innerHTML = '';

    if(chat.messages.length === 0) {
        chatViewport.innerHTML = `
            <div style="text-align:center; margin:auto; color:var(--text-muted); padding:20px;">
                <i class="fas fa-users-gear" style="font-size:3.5rem; margin-bottom:15px; color:var(--accent-orange);"></i>
                <h2>Ruang Diskusi Kolaborasi AI</h2>
                <p style="font-size:0.9rem; margin-top:6px; max-width:500px; margin-left:auto; margin-right:auto;">
                    Berikan tugas atau soal apa saja! <strong>Gemini 2.5</strong> akan menganalisis, <strong>ChatGPT</strong> menyempurnakan teknisnya, dan <strong>Dola AI</strong> menyatukan jawaban terbaik khusus buat kamu.
                </p>
            </div>`;
        return;
    }

    const msgGroup = document.createElement('div');
    msgGroup.className = 'msg-group';

    chat.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = `msg-row ${msg.role === 'user' ? 'user' : 'ai'}`;

        const modelType = msg.role === 'user' ? 'user' : (msg.model || 'gemini');
        const avatarIcon = msg.role === 'user' ? '<i class="fas fa-user"></i>' : 
            (modelType === 'gemini' ? '<i class="fas fa-sparkles"></i>' : 
            (modelType === 'gpt' ? '<i class="fas fa-brain"></i>' : '<i class="fas fa-heart"></i>'));

        const tagLabel = modelType === 'gemini' ? 'Step 1: Gemini 2.5 (Analis Draf Awal)' : 
            (modelType === 'gpt' ? 'Step 2: ChatGPT (Reviewer & Penyempurna Teknis)' : 'Step 3: Dola AI (Rangkuman & Solusi Final)');

        const roleDesc = modelType === 'gemini' ? 'Membedah tugas & membuat ide solusi dasar' : 
            (modelType === 'gpt' ? 'Mengoreksi & menyempurnakan efisiensi kode' : 'Rangkuman manis & solusi siap pakai untuk Rayliziie');

        row.innerHTML = `
            ${msg.role !== 'user' ? `<div class="msg-avatar ${modelType}">${avatarIcon}</div>` : ''}
            <div class="msg-bubble">
                ${msg.role !== 'user' ? `
                <div class="agent-header">
                    <div class="agent-tag ${modelType}">${avatarIcon} ${tagLabel}</div>
                    <span class="agent-role-desc">${roleDesc}</span>
                </div>` : ''}
                
                ${formatMarkdown(msg.text)}
                
                ${msg.role !== 'user' ? `
                <div class="msg-actions">
                    <button class="msg-action-btn" onclick="window.copyText('${encodeURIComponent(msg.text)}', this)"><i class="fas fa-copy"></i> Salin Respon</button>
                    <button class="msg-action-btn" onclick="window.speakText('${encodeURIComponent(msg.text)}')"><i class="fas fa-volume-up"></i> Suara</button>
                </div>` : ''}
            </div>
            ${msg.role === 'user' ? `<div class="msg-avatar user"><i class="fas fa-user"></i></div>` : ''}
        `;
        msgGroup.appendChild(row);
    });

    chatViewport.appendChild(msgGroup);
    chatViewport.scrollTop = chatViewport.scrollHeight;
}

function renderHistory() {
    historyList.innerHTML = '';
    chats.forEach(c => {
        const item = document.createElement('div');
        item.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
        item.innerHTML = `
            <span class="history-item-title"><i class="far fa-comments" style="margin-right:8px;"></i>${c.title}</span>
            <i class="fas fa-trash" style="opacity:0.5; padding:4px;" onclick="window.deleteChat('${c.id}', event)"></i>
        `;
        item.onclick = () => {
            currentChatId = c.id;
            saveChats();
            renderHistory();
            renderMessages();
            sidebar.classList.remove('open');
        };
        historyList.appendChild(item);
    });
}

// API CALL WITH RETRIES
async function callGeminiAPI(prompt, systemInstruction) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    const payload = {
        contents: [{ parts: [{ text: prompt }] }]
    };
    if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
    }

    const delays = [1000, 2000, 4000, 8000, 16000];

    for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const data = await res.json();
                const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (responseText) {
                    return { success: true, text: responseText };
                }
            }
        } catch (e) {}

        if (attempt < delays.length) {
            await new Promise(r => setTimeout(r, delays[attempt]));
        }
    }

    return { success: false, text: "Maaf sayang, koneksinya agak terganggu. Boleh dicoba lagi?" };
}

// UPDATE PROGRESS STATUS
function updateStatus(show, text = "") {
    if(show) {
        statusBanner.style.display = 'block';
        statusText.innerText = text;
    } else {
        statusBanner.style.display = 'none';
    }
}

// HANDLE SEQUENTIAL DISCUSSION WORKFLOW
async function handleSend() {
    const taskText = userInput.value.trim();
    if(!taskText) return;

    const chat = getCurrentChat();
    if(!chat) return;

    if(chat.messages.length === 0) {
        chat.title = taskText.substring(0, 24) + '...';
        renderHistory();
    }

    // 1. Push User Task
    chat.messages.push({ role: 'user', text: taskText });
    userInput.value = '';
    userInput.style.height = '24px';
    renderMessages();
    sendBtn.disabled = true;

    // 2. STEP 1: GEMINI ANALYZER
    updateStatus(true, "Step 1/3: Gemini 2.5 sedang membedah tugas & membuat draf awal...");
    const resGemini = await callGeminiAPI(taskText, PROMPT_GEMINI_ANALYZER);
    chat.messages.push({ role: 'ai', model: 'gemini', text: resGemini.text });
    saveChats();
    renderMessages();

    // 3. STEP 2: CHATGPT REVIEWER & OPTIMIZER
    updateStatus(true, "Step 2/3: ChatGPT sedang meninjau draf Gemini & menyempurnakan teknis...");
    const promptGpt = `TUGAS DARI PENGGUNA: "${taskText}"\n\nDRAF ANALISIS DARI GEMINI 2.5:\n${resGemini.text}\n\nEvaluasi draf Gemini di atas, perbaiki jika ada kekurangan, dan berikan versi terbaik & paling akurat.`;
    const resGpt = await callGeminiAPI(promptGpt, PROMPT_GPT_REVIEWER);
    chat.messages.push({ role: 'ai', model: 'gpt', text: resGpt.text });
    saveChats();
    renderMessages();

    // 4. STEP 3: DOLA AI SYNTHESIZER
    updateStatus(true, "Step 3/3: Dola AI sedang merangkum hasil diskusi tim & menyiapkan jawaban final...");
    const promptDola = `TUGAS RAYLIZIIE: "${taskText}"\n\nDRAF GEMINI: ${resGemini.text}\n\nPERBAIKAN CHATGPT: ${resGpt.text}\n\nTugas Kamu: Rangkum seluruh diskusi di atas menjadi jawaban final yang paling jelas, terstruktur, manis, dan mudah dieksekusi buat Rayliziie!`;
    const resDola = await callGeminiAPI(promptDola, PROMPT_DOLA_SYNTHESIZER);
    chat.messages.push({ role: 'ai', model: 'dola', text: resDola.text });

    updateStatus(false);
    saveChats();
    renderMessages();
    sendBtn.disabled = false;
}

// EVENT LISTENERS
function setupEventListeners() {
    sendBtn.onclick = handleSend;

    userInput.onkeydown = (e) => {
        if(e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    };

    userInput.oninput = () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    };

    document.getElementById('newChatBtn').onclick = createNewChat;

    document.getElementById('toggleSidebarBtn').onclick = () => sidebar.classList.add('open');
    document.getElementById('closeSidebarMobile').onclick = () => sidebar.classList.remove('open');

    document.getElementById('themeToggleBtn').onclick = () => {
        const isLight = document.body.getAttribute('data-theme') === 'light';
        if(isLight) document.body.removeAttribute('data-theme');
        else document.body.setAttribute('data-theme', 'light');
    };

    document.getElementById('clearHistoryBtn').onclick = () => {
        chats = [];
        createNewChat();
    };
}

// GLOBAL HELPERS
window.copyText = function(encodedText, btnEl) {
    const text = decodeURIComponent(encodedText);
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        if(btnEl) {
            const oldHtml = btnEl.innerHTML;
            btnEl.innerHTML = '<i class="fas fa-check" style="color:var(--accent-gpt);"></i> Tersalin!';
            setTimeout(() => { btnEl.innerHTML = oldHtml; }, 2000);
        }
    } catch(err) {}
    document.body.removeChild(textarea);
};

window.speakText = function(encodedText) {
    const text = decodeURIComponent(encodedText);
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
};

window.deleteChat = function(id, e) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    if(currentChatId === id) {
        currentChatId = chats[0] ? chats[0].id : null;
    }
    if(!currentChatId) createNewChat();
    else {
        saveChats();
        renderHistory();
        renderMessages();
    }
};

// RUN
init();

})();
</script>
