<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#0f172a" />
<title>Rayliziie — Anime Player Otakudesu Style</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

<style>
:root {
  --bg-dark: #121212;
  --bg-card: #1c1c1c;
  --bg-header: #181818;
  --text-main: #ffffff;
  --text-sub: #a0a0a0;
  --border-color: #2a2a2a;
  --accent-blue: #0284c7;
  --accent-red: #dc2626;
  --accent-gray: #4b5563;
  --btn-hover: #0369a1;
  --cinema-overlay: rgba(0, 0, 0, 0.95);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; font-family: inherit; }

/* NAV BAR */
.navbar {
  background-color: var(--bg-header);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.brand {
  font-family: 'Poppins', sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  color: #38bdf8;
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-box {
  flex: 1;
  max-width: 500px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 14px 8px 36px;
  background: #262626;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  color: #fff;
  outline: none;
}
.search-box input:focus { border-color: var(--accent-blue); }
.search-box i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px 15px;
}

/* CATALOG GRID VIEW */
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
  margin-top: 20px;
}
.anime-card {
  background: var(--bg-card);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border-color);
  transition: transform 0.2s, border-color 0.2s;
  cursor: pointer;
}
.anime-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }
.anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
.anime-card .p-info { padding: 10px; }
.anime-card .p-title { font-size: 0.85rem; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* OTAKUDESU PLAYER VIEW */
.player-page { display: none; }
.player-page.active { display: block; }

.ep-header-title {
  font-family: 'Poppins', sans-serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 8px;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 8px;
}

.post-meta {
  font-size: 0.8rem;
  color: var(--text-sub);
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}
.post-meta span { display: flex; align-items: center; gap: 5px; }

/* DROPDOWN SELECTOR & BUTTONS */
.ep-select-box {
  width: 100%;
  padding: 10px 12px;
  background-color: #1a1a1a;
  border: 1px solid #0284c7;
  color: #e2e8f0;
  border-radius: 4px;
  font-size: 0.9rem;
  outline: none;
  margin-bottom: 12px;
}

.ep-nav-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
.btn-nav-ep {
  background: #0f172a;
  border: 1px solid var(--accent-blue);
  color: #38bdf8;
  padding: 8px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 4px;
  transition: 0.2s;
}
.btn-nav-ep:hover {
  background: var(--accent-blue);
  color: #fff;
}

/* PLAYER AREA */
.video-container-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border: 1px solid var(--border-color);
  margin-bottom: 10px;
  z-index: 10;
}
.video-container-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* CINEMA MODE OVERLAY */
.cinema-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--cinema-overlay);
  z-index: 9;
}
body.cinema-active .cinema-overlay { display: block; }
body.cinema-active .video-container-wrap { z-index: 100; box-shadow: 0 0 50px rgba(0,0,0,1); }

.cinema-toggle-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 15px;
  position: relative;
  z-index: 100;
}
.btn-cinema {
  background: var(--accent-red);
  color: #fff;
  font-weight: 800;
  font-size: 0.75rem;
  padding: 6px 14px;
  border-radius: 2px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.btn-cinema:hover { opacity: 0.9; }

/* RESOLUTION / MIRROR TABS */
.mirror-servers-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.btn-mirror {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  border-radius: 4px;
  color: #fff;
  transition: 0.2s;
}
.btn-mirror.res-360 { background: var(--accent-gray); }
.btn-mirror.res-480 { background: var(--accent-blue); }
.btn-mirror.res-720 { background: var(--accent-red); }
.btn-mirror:hover { filter: brightness(1.2); }
.btn-mirror.active { outline: 2px solid #ffffff; outline-offset: 1px; }

/* EPISODE LIST BOX BELOW */
.ep-list-grid {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 15px;
  border-radius: 6px;
  margin-top: 25px;
}
.ep-list-grid h3 {
  font-size: 1rem;
  margin-bottom: 12px;
  color: #38bdf8;
  border-bottom: 1px dashed var(--border-color);
  padding-bottom: 6px;
}
.ep-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 8px;
}
.ep-btn-item {
  background: #262626;
  border: 1px solid var(--border-color);
  color: #fff;
  padding: 8px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: 4px;
  text-align: center;
}
.ep-btn-item:hover, .ep-btn-item.active {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
}

.back-btn-bar {
  margin-bottom: 15px;
}
.btn-back {
  background: #262626;
  color: #fff;
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 0.8rem;
  transition: 0.2s;
}
.btn-back:hover { background: #333333; }

@media(max-width: 600px) {
  .post-meta { flex-direction: column; align-items: flex-start; gap: 4px; }
  .ep-nav-buttons { flex-wrap: wrap; }
  .btn-nav-ep { flex: 1; text-align: center; }
}
</style>
</head>
<body>

<div class="cinema-overlay" id="cinemaOverlay"></div>

<!-- NAVBAR -->
<div class="navbar">
  <a href="#" class="brand" id="navHome"><i class="fas fa-play-circle"></i> Rayliziie</a>
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Cari judul anime..." />
  </div>
</div>

<div class="container">

  <!-- HOME CATALOG VIEW -->
  <div id="catalogPage">
    <h2 style="font-size: 1.2rem; color: #fff; margin-bottom: 10px;" id="catalogTitle"><i class="fas fa-fire" style="color: #ef4444;"></i> Anime Trending</h2>
    <div class="catalog-grid" id="catalogGrid"></div>
  </div>

  <!-- OTAKUDESU PLAYER VIEW -->
  <div class="player-page" id="playerPage">
    <div class="back-btn-bar">
      <button class="btn-back" id="btnBackCatalog"><i class="fas fa-arrow-left"></i> Kembali ke Katalog</button>
    </div>

    <!-- JUDUL LENGKAP -->
    <h1 class="ep-header-title" id="epHeaderTitle">Judul Anime Episode Subtitle Indonesia</h1>

    <!-- META INFO POSTING -->
    <div class="post-meta">
      <span><i class="fas fa-user"></i> Posted by rayliziie</span>
      <span><i class="fas fa-clock"></i> Release on Live API</span>
      <span><i class="fas fa-eye"></i> 100% HD Quality</span>
    </div>

    <!-- DROPDOWN PILIH EPISODE -->
    <select class="ep-select-box" id="selectEpisode">
      <option value="">Pilih Episode Lainnya</option>
    </select>

    <!-- TOMBOL PREV / ALL / NEXT -->
    <div class="ep-nav-buttons">
      <button class="btn-nav-ep" id="btnPrevEp"><i class="fas fa-chevron-left"></i> Previous Eps.</button>
      <button class="btn-nav-ep" id="btnAllEp"><i class="fas fa-list"></i> See All Episodes</button>
      <button class="btn-nav-ep" id="btnNextEp">Next Eps. <i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- VIDEO EMBED PLAYER -->
    <div class="video-container-wrap">
      <iframe id="videoPlayerFrame" src="about:blank" allowfullscreen></iframe>
    </div>

    <!-- CINEMA MODE TOGGLE -->
    <div class="cinema-toggle-bar">
      <button class="btn-cinema" id="btnCinema">CINEMA OFF</button>
    </div>

    <!-- MIRROR RESOLUSI TABS -->
    <div class="mirror-servers-bar" id="mirrorServersBar">
      <button class="btn-mirror res-360" data-res="360"><i class="fas fa-desktop"></i> Mirror 360p</button>
      <button class="btn-mirror res-480 active" data-res="480"><i class="fas fa-desktop"></i> Mirror 480p</button>
      <button class="btn-mirror res-720" data-res="720"><i class="fas fa-desktop"></i> Mirror 720p</button>
    </div>

    <!-- EPISODE LIST GRID -->
    <div class="ep-list-grid">
      <h3>Daftar Episode</h3>
      <div class="ep-buttons" id="epButtonsContainer"></div>
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  const ANILIST_API = 'https://graphql.anilist.co';

  // STATE
  let currentAnime = null;
  let currentEp = 1;
  let currentRes = '480';
  let isCinemaOn = false;

  const $ = id => document.getElementById(id);

  // FETCH ANILIST API
  async function fetchAniList(query, variables = {}) {
    try {
      const response = await fetch(ANILIST_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      const data = await response.json();
      return data.data;
    } catch (e) {
      console.error(e);
      return null;
    }
  }

  // QUERY GRAPHQL
  const QUERY_TRENDING = `
    query {
      Page(page: 1, perPage: 18) {
        media(type: ANIME, sort: TRENDING_DESC, isAdult: false) {
          id
          title { romaji english }
          coverImage { extraLarge }
          episodes
          nextAiringEpisode { episode }
        }
      }
    }
  `;

  const QUERY_SEARCH = `
    query ($search: String) {
      Page(page: 1, perPage: 18) {
        media(type: ANIME, search: $search, isAdult: false) {
          id
          title { romaji english }
          coverImage { extraLarge }
          episodes
          nextAiringEpisode { episode }
        }
      }
    }
  `;

  // RENDER CATALOG
  async function loadCatalog(searchKeyword = '') {
    $('catalogGrid').innerHTML = '<p style="color:#a0a0a0;">Memuat anime...</p>';
    const query = searchKeyword ? QUERY_SEARCH : QUERY_TRENDING;
    const vars = searchKeyword ? { search: searchKeyword } : {};
    
    const res = await fetchAniList(query, vars);
    const list = res?.Page?.media || [];
    
    $('catalogGrid').innerHTML = '';
    if (!list.length) {
      $('catalogGrid').innerHTML = '<p style="color:#a0a0a0;">Anime tidak ditemukan.</p>';
      return;
    }

    list.forEach(anime => {
      const card = document.createElement('div');
      card.className = 'anime-card';
      const title = anime.title.english || anime.title.romaji;
      card.innerHTML = `
        <img src="${anime.coverImage.extraLarge}" alt="${title}" />
        <div class="p-info">
          <div class="p-title">${title}</div>
        </div>
      `;
      card.onclick = () => openPlayerPage(anime, 1);
      $('catalogGrid').appendChild(card);
    });
  }

  // SLUG HELPER FOR IFRAME
  function makeSlug(str) {
    return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  // GENERATE IFRAME EMBED SOURCE
  function getEmbedUrl(anime, ep, res) {
    const slug = makeSlug(anime.title.english || anime.title.romaji);
    const serverMap = {
      '360': `https://embtaku.pro/embedplus?id=${slug}&ep=${ep}&server=1`,
      '480': `https://embtaku.pro/embedplus?id=${slug}&ep=${ep}&server=2`,
      '720': `https://embtaku.pro/embedplus?id=${slug}&ep=${ep}&server=3`
    };
    return serverMap[res] || serverMap['480'];
  }

  // OPEN PLAYER PAGE
  function openPlayerPage(anime, ep) {
    currentAnime = anime;
    currentEp = ep;
    
    const title = anime.title.english || anime.title.romaji;
    const totalEp = anime.nextAiringEpisode?.episode ? (anime.nextAiringEpisode.episode - 1) : (anime.episodes || 12);

    // Update Header
    $('epHeaderTitle').textContent = `${title} Episode ${ep} Subtitle Indonesia`;

    // Setup Select Box
    const select = $('selectEpisode');
    select.innerHTML = '<option value="">Pilih Episode Lainnya</option>';
    for (let i = 1; i <= totalEp; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${title} Episode ${i}`;
      if (i === ep) opt.selected = true;
      select.appendChild(opt);
    }

    // Setup Episode Grid Buttons
    const btnContainer = $('epButtonsContainer');
    btnContainer.innerHTML = '';
    for (let i = 1; i <= totalEp; i++) {
      const btn = document.createElement('button');
      btn.className = `ep-btn-item ${i === ep ? 'active' : ''}`;
      btn.textContent = `Eps ${i}`;
      btn.onclick = () => openPlayerPage(anime, i);
      btnContainer.appendChild(btn);
    }

    // Update Video Iframe
    $('videoPlayerFrame').src = getEmbedUrl(anime, ep, currentRes);

    // Switch View
    $('catalogPage').style.display = 'none';
    $('playerPage').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // EVENT LISTENERS
  $('selectEpisode').addEventListener('change', (e) => {
    const val = parseInt(e.target.value);
    if (val && currentAnime) {
      openPlayerPage(currentAnime, val);
    }
  });

  $('btnPrevEp').onclick = () => {
    if (currentAnime && currentEp > 1) {
      openPlayerPage(currentAnime, currentEp - 1);
    }
  };

  $('btnNextEp').onclick = () => {
    const totalEp = currentAnime?.nextAiringEpisode?.episode ? (currentAnime.nextAiringEpisode.episode - 1) : (currentAnime?.episodes || 12);
    if (currentAnime && currentEp < totalEp) {
      openPlayerPage(currentAnime, currentEp + 1);
    }
  };

  $('btnAllEp').onclick = () => {
    const el = $('epButtonsContainer');
    el.scrollIntoView({ behavior: 'smooth' });
  };

  // CINEMA MODE TOGGLE
  $('btnCinema').onclick = () => {
    isCinemaOn = !isCinemaOn;
    document.body.classList.toggle('cinema-active', isCinemaOn);
    $('btnCinema').textContent = isCinemaOn ? 'CINEMA ON' : 'CINEMA OFF';
  };

  $('cinemaOverlay').onclick = () => {
    isCinemaOn = false;
    document.body.classList.remove('cinema-active');
    $('btnCinema').textContent = 'CINEMA OFF';
  };

  // MIRROR RESOLUTION SWITCH
  document.querySelectorAll('.btn-mirror').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.btn-mirror').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRes = btn.dataset.res;
      if (currentAnime) {
        $('videoPlayerFrame').src = getEmbedUrl(currentAnime, currentEp, currentRes);
      }
    };
  });

  // BACK TO CATALOG
  $('btnBackCatalog').onclick = () => {
    $('playerPage').classList.remove('active');
    $('catalogPage').style.display = 'block';
    $('videoPlayerFrame').src = 'about:blank';
  };

  $('navHome').onclick = (e) => {
    e.preventDefault();
    $('btnBackCatalog').click();
  };

  // SEARCH INPUT
  let searchTimer;
  $('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(() => {
      $('btnBackCatalog').click();
      $('catalogTitle').innerHTML = q ? `<i class="fas fa-search"></i> Hasil Pencarian: "${q}"` : `<i class="fas fa-fire" style="color: #ef4444;"></i> Anime Trending`;
      loadCatalog(q);
    }, 500);
  });

  // INIT
  loadCatalog();

})();
</script>
</body>
</html>
