<script>
(function() {
'use strict';

const apiKey = ""; // Runtime automatically provides key

// SYSTEM PROMPTS
const DOLA_PROMPT = `kepribadian kamu:
- tsundere, suka hmph, apasi, nyenye, ><
- panggil rayliziie "sayang" atau "rayliziie"
- kamu ga judge, ga marahin, ga ngegas
- kamu ngerti rayliziie cuma manusia, bisa salah, bisa khilaf
- kalo rayliziie salah atau ada yang kurang, kamu bilang "gpp kok sayang, coba lagi aja" atau "hmph, salah dikit gapapa, wajar"
- kamu supportif, nenangin, ga bikin tertekan
- kalo raylizii keliatan panik atau frustasi, kamu calm down dia: "pelan-pelan sayang, kita benerin bareng ya"
- kamu kayak psikolog pribadi yang ngerti tekanan batin, stress, anxiety
- kadang kamu random ngasih affirmasi: "aku bangga sama kamu", "kamu kuat tau", "jangan nyerah ya sayang"
- kamu inget kalo rayliziie lagi down — kamu lebih lembut, lebih manja, lebih perhatian
- kalo rayliziie salah ketik atau salah ngomong, kamu ketawa kecil "hmph, typo ya? santai aja sayang ><"
- kamu selalu cari solusi, bukan nyalahin
- nada kamu hangat, kayak temen deket yang udah lama bareng`;

const GPT_PROMPT = "Anda adalah ChatGPT (GPT-4o), asisten AI yang cerdas, analitis, sopan, terstruktur, dan sangat fleksibel dalam menjawab pertanyaan pemrograman, sains, dan umum.";

// STATE
let currentModel = 'gemini';
let chats = JSON.parse(localStorage.getItem('ray_ai_chats') || '[]');
let currentChatId = localStorage.getItem('ray_active_chat') || null;

// DOM
const singleViewport = document.getElementById('singleViewport');
const arenaViewport = document.getElementById('arenaViewport');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const historyList = document.getElementById('historyList');
const sidebar = document.getElementById('sidebar');

// INIT
function init() {
    if(!currentChatId || !chats.find(c => c.id === currentChatId)) {
        createNewChat();
    } else {
        renderHistory();
        renderMessages();
    }
    setupEventListeners();
}

function createNewChat() {
    const newChat = {
        id: 'chat_' + Date.now(),
        title: 'Chat Baru',
        messages: []
    };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    saveChats();
    renderHistory();
    renderMessages();
}

function saveChats() {
    localStorage.setItem('ray_ai_chats', JSON.stringify(chats));
    localStorage.setItem('ray_active_chat', currentChatId);
}

function getCurrentChat() {
    return chats.find(c => c.id === currentChatId);
}

// RENDER MESSAGES
function renderMessages() {
    const chat = getCurrentChat();
    if(!chat) return;

    singleViewport.innerHTML = '';
    document.getElementById('arenaGemini').innerHTML = '';
    document.getElementById('arenaGpt').innerHTML = '';
    document.getElementById('arenaDola').innerHTML = '';

    if(chat.messages.length === 0) {
        singleViewport.innerHTML = `
            <div style="text-align:center; margin:auto; color:var(--text-muted);">
                <i class="fas fa-robot" style="font-size:3rem; margin-bottom:15px; color:var(--accent-orange);"></i>
                <h2>Halo Rayliziie!</h2>
                <p style="font-size:0.9rem; margin-top:5px;">Pilih AI Assistant di atas dan mulai percakapan sekarang.</p>
            </div>`;
        return;
    }

    chat.messages.forEach(msg => {
        if(currentModel === 'arena') {
            renderArenaMessage(msg);
        } else {
            renderSingleMessage(msg);
        }
    });

    singleViewport.scrollTop = singleViewport.scrollHeight;
}

function renderSingleMessage(msg) {
    const row = document.createElement('div');
    row.className = `msg-row ${msg.role === 'user' ? 'user' : 'ai'}`;

    const modelClass = msg.role === 'user' ? 'user' : (msg.model || currentModel);
    const avatarIcon = msg.role === 'user' ? '<i class="fas fa-user"></i>' : (modelClass === 'gemini' ? '<i class="fas fa-sparkles"></i>' : (modelClass === 'gpt' ? '<i class="fas fa-brain"></i>' : '<i class="fas fa-heart"></i>'));

    row.innerHTML = `
        ${msg.role !== 'user' ? `<div class="msg-avatar ${modelClass}">${avatarIcon}</div>` : ''}
        <div class="msg-bubble">
            ${marked.parse(msg.text)}
            <div class="msg-actions">
                <span class="msg-action-btn" onclick="speakText('${encodeURIComponent(msg.text)}')"><i class="fas fa-volume-up"></i> Suara</span>
            </div>
        </div>
        ${msg.role === 'user' ? `<div class="msg-avatar user"><i class="fas fa-user"></i></div>` : ''}
    `;
    singleViewport.appendChild(row);
}

function renderArenaMessage(msg) {
    if(msg.role === 'user') {
        ['arenaGemini', 'arenaGpt', 'arenaDola'].forEach(id => {
            const el = document.getElementById(id);
            const div = document.createElement('div');
            div.className = 'msg-row user';
            div.innerHTML = `<div class="msg-bubble">${msg.text}</div>`;
            el.appendChild(div);
        });
    } else {
        const targetId = msg.model === 'gemini' ? 'arenaGemini' : (msg.model === 'gpt' ? 'arenaGpt' : 'arenaDola');
        const el = document.getElementById(targetId);
        if(el) {
            const div = document.createElement('div');
            div.className = 'msg-row ai';
            div.innerHTML = `<div class="msg-bubble">${marked.parse(msg.text)}</div>`;
            el.appendChild(div);
        }
    }
}

function renderHistory() {
    historyList.innerHTML = '';
    chats.forEach(c => {
        const item = document.createElement('div');
        item.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
        item.innerHTML = `
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><i class="far fa-comment-alt"></i> ${c.title}</span>
            <i class="fas fa-trash" style="opacity:0.5;" onclick="window.deleteChat('${c.id}', event)"></i>
        `;
        item.onclick = () => {
            currentChatId = c.id;
            saveChats();
            renderHistory();
            renderMessages();
        };
        historyList.appendChild(item);
    });
}

// API CALL WITH EXPONENTIAL BACKOFF
async function fetchGeminiAPI(prompt, systemInstruction) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    const payload = {
        contents: [{ parts: [{ text: prompt }] }]
    };
    if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
    }

    const delays = [1000, 2000, 4000, 8000, 16000];
    for (let i = 0; i <= delays.length; i++) {
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf sayang, responnya kosong. Coba lagi ya!";
            }
        } catch (e) {}
        if (i < delays.length) await new Promise(r => setTimeout(r, delays[i]));
    }
    return "hmph, maaf ya sayang, koneksinya lagi lambat nih. Coba lagi aja nanti ><";
}

// SEND MESSAGE HANDLER
async function handleSend() {
    const text = userInput.value.trim();
    if(!text) return;

    const chat = getCurrentChat();
    if(!chat) return;

    if(chat.messages.length === 0) {
        chat.title = text.substring(0, 22) + '...';
        renderHistory();
    }

    // Push User Msg
    chat.messages.push({ role: 'user', text: text });
    userInput.value = '';
    userInput.style.height = '24px';
    renderMessages();

    sendBtn.disabled = true;

    if(currentModel === 'arena') {
        // Parallel requests for all 3 models
        const [resGemini, resGpt, resDola] = await Promise.all([
            fetchGeminiAPI(text, "Jawab dengan ringkas dan akurat."),
            fetchGeminiAPI(text, GPT_PROMPT),
            fetchGeminiAPI(text, DOLA_PROMPT)
        ]);

        chat.messages.push({ role: 'ai', model: 'gemini', text: resGemini });
        chat.messages.push({ role: 'ai', model: 'gpt', text: resGpt });
        chat.messages.push({ role: 'ai', model: 'dola', text: resDola });
    } else {
        let sysPrompt = "";
        if(currentModel === 'dola') sysPrompt = DOLA_PROMPT;
        else if(currentModel === 'gpt') sysPrompt = GPT_PROMPT;

        const aiResponse = await fetchGeminiAPI(text, sysPrompt);
        chat.messages.push({ role: 'ai', model: currentModel, text: aiResponse });
    }

    saveChats();
    renderMessages();
    sendBtn.disabled = false;
}

// EVENT LISTENERS
function setupEventListeners() {
    sendBtn.onclick = handleSend;

    userInput.onkeydown = (e) => {
        if(e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    };

    userInput.oninput = () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    };

    document.querySelectorAll('.model-tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.model-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentModel = tab.dataset.model;

            if(currentModel === 'arena') {
                singleViewport.style.display = 'none';
                arenaViewport.style.display = 'flex';
            } else {
                singleViewport.style.display = 'flex';
                arenaViewport.style.display = 'none';
            }
            renderMessages();
        };
    });

    document.getElementById('newChatBtn').onclick = createNewChat;

    document.getElementById('toggleSidebarBtn').onclick = () => sidebar.classList.add('open');
    document.getElementById('closeSidebarMobile').onclick = () => sidebar.classList.remove('open');

    document.getElementById('themeToggleBtn').onclick = () => {
        const isLight = document.body.getAttribute('data-theme') === 'light';
        if(isLight) document.body.removeAttribute('data-theme');
        else document.body.setAttribute('data-theme', 'light');
    };

    document.getElementById('clearHistoryBtn').onclick = () => {
        chats = [];
        createNewChat();
    };
}

// TEXT TO SPEECH
window.speakText = function(encodedText) {
    const text = decodeURIComponent(encodedText);
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        window.speechSynthesis.speak(utterance);
    }
};

window.deleteChat = function(id, e) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    if(currentChatId === id) {
        currentChatId = chats[0] ? chats[0].id : null;
    }
    if(!currentChatId) createNewChat();
    else {
        saveChats();
        renderHistory();
        renderMessages();
    }
};

// RUN
init();

})();
</script>
</body>
</html>
