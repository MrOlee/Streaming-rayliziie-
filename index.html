<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayliziie nime - Streaming Anime Sub Indo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <!-- Logo -->
            <a href="#" onclick="showHome()" class="flex items-center gap-2 font-extrabold text-xl sm:text-2xl tracking-wider text-white hover:opacity-90 transition-opacity">
                <span class="text-brand-500"><i class="fa-solid fa-play-circle"></i> rayliziie</span>
                <span class="text-slate-300">nime</span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-xs sm:max-w-md">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Cari anime..." 
                        onkeypress="handleSearchKey(event)"
                        class="w-full bg-slate-800/80 border border-slate-700/80 rounded-full py-2 pl-4 pr-10 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-brand-500 transition-all placeholder-slate-400"
                    />
                    <button onclick="executeSearch()" class="absolute right-3 top-2.5 text-slate-400 hover:text-brand-500 transition-colors">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <!-- Favorite Nav -->
            <button onclick="showFavorites()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm px-3.5 py-2 rounded-full border border-slate-700 transition-colors">
                <i class="fa-solid fa-bookmark text-brand-500"></i>
                <span class="hidden sm:inline font-medium">Favorit</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Hero Banner -->
        <div class="bg-gradient-to-r from-brand-700 via-indigo-900 to-slate-900 rounded-2xl p-6 sm:p-8 mb-8 shadow-xl border border-brand-500/20">
            <h1 class="text-2xl sm:text-4xl font-extrabold mb-2 text-white">Selamat Datang di rayliziie nime</h1>
            <p class="text-slate-300 text-xs sm:text-sm max-w-2xl leading-relaxed">Platform streaming anime subtitle Indonesia gratis, cepat, dan terupdate setiap hari.</p>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6 border-b border-slate-800/80 pb-4">
            <h2 id="sectionTitle" class="text-lg sm:text-xl font-bold flex items-center gap-2 text-slate-100">
                <i class="fa-solid fa-fire text-brand-500"></i> Anime Terbaru
            </h2>
            <button id="backBtn" onclick="showHome()" class="hidden text-xs sm:text-sm text-brand-500 hover:text-brand-600 font-semibold transition-colors flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="flex flex-col justify-center items-center py-20 gap-3">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-brand-500 border-t-transparent"></div>
            <p class="text-slate-400 text-xs font-medium">Memuat data dari Indocast API...</p>
        </div>

        <!-- Anime Grid -->
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-6 hidden">
            <!-- Dynamic Data -->
        </div>

        <!-- Detail & Player View -->
        <div id="detailView" class="hidden space-y-6">
            <!-- Video Player -->
            <div class="bg-black rounded-xl overflow-hidden aspect-video shadow-2xl border border-slate-800 relative">
                <iframe id="videoPlayer" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- Detail Info -->
            <div class="bg-slate-900/90 rounded-xl p-6 border border-slate-800 shadow-md">
                <div class="flex justify-between items-start gap-4 mb-4">
                    <div>
                        <h2 id="animeTitle" class="text-xl sm:text-2xl font-bold text-white mb-1">Judul Anime</h2>
                        <span id="animeBadge" class="inline-block bg-brand-500/20 text-brand-500 text-xs px-2.5 py-1 rounded-md font-semibold border border-brand-500/30">Sub Indo</span>
                    </div>
                    <button id="favBtn" onclick="toggleFavoriteCurrent()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-xl border border-slate-700 transition-colors">
                        <i id="favIcon" class="fa-regular fa-bookmark text-lg"></i>
                    </button>
                </div>

                <p id="animeSynopsis" class="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6">Memuat sinopsis...</p>

                <!-- Episode List -->
                <h3 class="text-sm font-bold text-slate-200 mb-3 uppercase tracking-wider border-b border-slate-800 pb-2">
                    <i class="fa-solid fa-list-ul text-brand-500 mr-2"></i>Pilih Episode
                </h3>
                <div id="episodeList" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto pr-2">
                    <!-- Dynamic Episodes -->
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-slate-500 text-xs">
        <p>© 2026 <strong class="text-slate-300">rayliziie nime</strong>. Powered by Indocast API.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_KEY = 'bb47332ceca91e3a2c97128a40c798a69306400072cc4b5a352800697069e45c';
        const API_BASE = 'https://indocast.site/api/animekompi';
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        const loading = document.getElementById('loading');
        const animeGrid = document.getElementById('animeGrid');
        const detailView = document.getElementById('detailView');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');

        let currentAnimeData = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestAnime();
        });

        // Universal Fetch Helper dengan Header API Key
        async function fetchAPI(endpoint) {
            const targetUrl = `${API_BASE}${endpoint}`;
            const proxiedUrl = `${CORS_PROXY}${encodeURIComponent(targetUrl)}`;

            const res = await fetch(proxiedUrl, {
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': API_KEY
                }
            });

            if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
            return await res.json();
        }

        // 1. Ambil Anime Terbaru (Home Page)
        async function fetchLatestAnime() {
            showLoading();
            try {
                const res = await fetchAPI('/home?page=1');
                const list = res.data || res.results || res.anime || (Array.isArray(res) ? res : []);
                renderGrid(list);
            } catch (err) {
                console.error(err);
                animeGrid.innerHTML = `<p class="col-span-full text-center text-red-400 py-10 text-sm">Gagal mengambil data dari API Indocast.</p>`;
                hideLoading();
            }
        }

        // 2. Render Card Anime
        function renderGrid(list) {
            animeGrid.innerHTML = '';

            if (!list || list.length === 0) {
                animeGrid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10 text-sm">Tidak ada anime yang ditemukan.</p>`;
                hideLoading();
                return;
            }

            list.forEach(item => {
                const title = item.title || item.name || 'Judul Tidak Tersedia';
                const image = item.thumb || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
                const path = item.path || item.endpoint || item.slug || item.id || '';
                const episode = item.episode || item.latest_episode || '';

                const card = document.createElement('div');
                card.className = 'bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-brand-500/80 transition-all duration-300 hover:-translate-y-1 group cursor-pointer flex flex-col shadow-lg';
                card.onclick = () => loadDetail(path);

                card.innerHTML = `
                    <div class="relative aspect-[3/4] overflow-hidden bg-slate-800">
                        <img src="${image}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                        ${episode ? `<span class="absolute top-2 right-2 bg-brand-600 text-[10px] text-white font-bold px-2 py-0.5 rounded shadow">${episode}</span>` : ''}
                    </div>
                    <div class="p-3 flex-grow flex flex-col justify-between">
                        <h3 class="font-semibold text-xs sm:text-sm text-slate-200 line-clamp-2 group-hover:text-brand-500 transition-colors leading-snug">${title}</h3>
                    </div>
                `;
                animeGrid.appendChild(card);
            });

            hideLoading();
        }

        // 3. Load Detail Anime
        async function loadDetail(path) {
            if (!path) return;
            showLoading();

            try {
                const res = await fetchAPI(`/detail?path=${encodeURIComponent(path)}`);
                const anime = res.data || res;
                currentAnimeData = { ...anime, path };

                document.getElementById('animeTitle').textContent = anime.title || 'Detail Anime';
                document.getElementById('animeSynopsis').textContent = anime.synopsis || anime.description || 'Sinopsis tidak tersedia.';

                updateFavButtonUI();

                // Set Episode List
                const epContainer = document.getElementById('episodeList');
                epContainer.innerHTML = '';
                const episodes = anime.episodes || anime.episode_list || [];

                if (episodes.length > 0) {
                    episodes.forEach((ep, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'px-3 py-1.5 bg-slate-800 hover:bg-brand-600 text-xs font-semibold rounded-lg border border-slate-700 transition-colors text-slate-200 hover:text-white';
                        btn.textContent = ep.title || ep.name || `Episode ${i + 1}`;
                        btn.onclick = () => playEpisode(ep.episode_id || ep.id || ep.path);
                        epContainer.appendChild(btn);
                    });

                    // Auto-play episode pertama jika ada
                    const firstEpId = episodes[0].episode_id || episodes[0].id || episodes[0].path;
                    if (firstEpId) playEpisode(firstEpId);
                } else {
                    epContainer.innerHTML = `<p class="text-xs text-slate-500">Episode belum tersedia.</p>`;
                }

                animeGrid.classList.add('hidden');
                detailView.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                sectionTitle.innerHTML = `<i class="fa-solid fa-circle-play text-brand-500"></i> Memutar Anime`;

            } catch (err) {
                console.error(err);
                alert('Gagal memuat detail anime.');
            } finally {
                hideLoading();
            }
        }

        // 4. Play Stream Episode Video
        async function playEpisode(episodeId) {
            if (!episodeId) return;

            try {
                const res = await fetchAPI(`/play?episode_id=${encodeURIComponent(episodeId)}`);
                const playData = res.data || res;
                const streamUrl = playData.stream_url || playData.url || playData.link || playData.stream;

                const player = document.getElementById('videoPlayer');
                if (streamUrl) {
                    player.src = streamUrl;
                } else {
                    alert('Link video untuk episode ini tidak ditemukan.');
                }
            } catch (err) {
                console.error('Gagal memutar video:', err);
            }
        }

        // 5. Pencarian Anime
        async function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            showLoading();
            sectionTitle.innerHTML = `<i class="fa-solid fa-magnifying-glass text-brand-500"></i> Hasil Pencarian: "${query}"`;
            backBtn.classList.remove('hidden');

            try {
                const res = await fetchAPI(`/list`);
                const allAnime = res.data || res.results || (Array.isArray(res) ? res : []);
                
                // Filter lokal berdasarkan kata kunci
                const filtered = allAnime.filter(item => 
                    (item.title || item.name || '').toLowerCase().includes(query.toLowerCase())
                );
                
                renderGrid(filtered);
            } catch (err) {
                console.error(err);
                hideLoading();
            }
        }

        function handleSearchKey(e) {
            if (e.key === 'Enter') executeSearch();
        }

        // Favorit Manager
        function getFavorites() {
            return JSON.parse(localStorage.getItem('rayliziie_favs') || '[]');
        }

        function toggleFavoriteCurrent() {
            if (!currentAnimeData) return;
            let favs = getFavorites();
            const existsIndex = favs.findIndex(item => item.path === currentAnimeData.path);

            if (existsIndex > -1) {
                favs.splice(existsIndex, 1);
            } else {
                favs.push({
                    title: currentAnimeData.title,
                    path: currentAnimeData.path,
                    thumb: currentAnimeData.thumb || currentAnimeData.image || ''
                });
            }

            localStorage.setItem('rayliziie_favs', JSON.stringify(favs));
            updateFavButtonUI();
        }

        function updateFavButtonUI() {
            if (!currentAnimeData) return;
            const favs = getFavorites();
            const isFav = favs.some(item => item.path === currentAnimeData.path);
            const icon = document.getElementById('favIcon');

            icon.className = isFav ? 'fa-solid fa-bookmark text-brand-500' : 'fa-regular fa-bookmark text-slate-400';
        }

        function showFavorites() {
            showLoading();
            detailView.classList.add('hidden');
            document.getElementById('videoPlayer').src = '';
            sectionTitle.innerHTML = `<i class="fa-solid fa-bookmark text-brand-500"></i> Anime Favorit Saya`;
            backBtn.classList.remove('hidden');

            renderGrid(getFavorites());
        }

        function showHome() {
            detailView.classList.add('hidden');
            document.getElementById('videoPlayer').src = '';
            document.getElementById('searchInput').value = '';
            backBtn.classList.add('hidden');
            sectionTitle.innerHTML = `<i class="fa-solid fa-fire text-brand-500"></i> Anime Terbaru`;
            fetchLatestAnime();
        }

        function showLoading() {
            loading.classList.remove('hidden');
            animeGrid.classList.add('hidden');
            detailView.classList.add('hidden');
        }

        function hideLoading() {
            loading.classList.add('hidden');
            if (detailView.classList.contains('hidden')) {
                animeGrid.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
