<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rayliziie nime - Nonton Anime Sub Indo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Logo -->
            <a href="#" onclick="showHome()" class="flex items-center gap-2 font-bold text-xl sm:text-2xl tracking-wider text-white">
                <span class="text-brand-500"><i class="fa-solid fa-play-circle"></i> rayliziie</span>
                <span class="text-slate-300">nime</span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Cari anime..." 
                        onkeypress="handleSearch(event)"
                        class="w-full bg-slate-800 border border-slate-700 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-brand-500 transition-colors placeholder-slate-400"
                    />
                    <button onclick="executeSearch()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Hero / Alert Banner -->
        <div class="bg-gradient-to-r from-brand-700 to-indigo-900 rounded-2xl p-6 sm:p-8 mb-8 shadow-lg shadow-brand-500/10">
            <h1 class="text-2xl sm:text-4xl font-extrabold mb-2 text-white">Selamat Datang di rayliziie nime</h1>
            <p class="text-slate-200 text-sm sm:text-base">Streaming anime subtitle Indonesia gratis dan terupdate setiap hari.</p>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6">
            <h2 id="sectionTitle" class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-fire text-brand-500"></i> Anime Terbaru
            </h2>
            <button id="backBtn" onclick="showHome()" class="hidden text-sm text-brand-500 hover:underline">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col justify-center items-center py-20 gap-3">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-brand-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm">Memuat data dari server...</p>
        </div>

        <!-- Content Area: Anime Grid -->
        <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-6 hidden">
            <!-- Card items will be inserted dynamically by JS -->
        </div>

        <!-- Content Area: Player & Detail View -->
        <div id="detailView" class="hidden space-y-6">
            <!-- Video Player -->
            <div class="bg-black rounded-xl overflow-hidden aspect-video shadow-2xl border border-slate-800 relative">
                <iframe id="videoPlayer" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- Detail Info -->
            <div class="bg-slate-900 rounded-xl p-6 border border-slate-800">
                <h2 id="animeTitle" class="text-2xl font-bold mb-2">Title Placeholder</h2>
                <p id="animeSynopsis" class="text-slate-400 text-sm leading-relaxed mb-4">Synopsis goes here...</p>

                <!-- Episode List -->
                <h3 class="text-lg font-bold mb-3 border-b border-slate-800 pb-2">Daftar Episode</h3>
                <div id="episodeList" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto pr-2">
                    <!-- Episodes dynamic list -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-center text-slate-500 text-sm">
        <p>© 2026 <strong class="text-slate-300">rayliziie nime</strong>. API Powered by Indocast.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_BASE = 'https://indocast.site/animekompi';

        const loading = document.getElementById('loading');
        const animeGrid = document.getElementById('animeGrid');
        const detailView = document.getElementById('detailView');
        const sectionTitle = document.getElementById('sectionTitle');
        const backBtn = document.getElementById('backBtn');

        // Fetch Data Awal saat website dibuka
        document.addEventListener('DOMContentLoaded', () => {
            fetchLatestAnime();
        });

        // 1. Ambil Anime Terbaru / Beranda
        async function fetchLatestAnime() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}`);
                const data = await response.json();
                
                // Menyesuaikan struktur JSON dari endpoint
                const animeList = Array.isArray(data) ? data : (data.data || data.results || []);
                renderGrid(animeList);
            } catch (error) {
                console.error('Gagal mengambil data:', error);
                animeGrid.innerHTML = `<p class="col-span-full text-center text-red-400 py-10">Gagal memuat data dari API. Silakan coba lagi nanti.</p>`;
                hideLoading();
            }
        }

        // 2. Render List Card Anime
        function renderGrid(list) {
            animeGrid.innerHTML = '';
            
            if (!list || list.length === 0) {
                animeGrid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">Anime tidak ditemukan.</p>`;
                hideLoading();
                return;
            }

            list.forEach(item => {
                // Handling fleksibel untuk property nama/gambar/endpoint
                const title = item.title || item.name || 'Judul Tidak Tersedia';
                const image = item.thumb || item.image || item.poster || 'https://via.placeholder.com/300x400?text=No+Cover';
                const endpoint = item.endpoint || item.slug || item.id || '';
                const episode = item.episode || item.latest_episode || '';

                const card = document.createElement('div');
                card.className = 'bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-brand-500 transition-all duration-300 hover:-translate-y-1 group cursor-pointer flex flex-col';
                card.onclick = () => loadDetail(endpoint);

                card.innerHTML = `
                    <div class="relative aspect-[3/4] overflow-hidden bg-slate-800">
                        <img src="${image}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                        ${episode ? `<span class="absolute top-2 right-2 bg-brand-600 text-xs text-white font-bold px-2 py-1 rounded-md shadow">${episode}</span>` : ''}
                    </div>
                    <div class="p-3 flex-grow flex flex-col justify-between">
                        <h3 class="font-semibold text-sm text-slate-200 line-clamp-2 group-hover:text-brand-500 transition-colors">${title}</h3>
                    </div>
                `;
                animeGrid.appendChild(card);
            });

            hideLoading();
        }

        // 3. Pencarian Anime
        async function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            showLoading();
            sectionTitle.innerHTML = `<i class="fa-solid fa-magnifying-glass text-brand-500"></i> Hasil Pencarian: "${query}"`;
            backBtn.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                const searchResults = Array.isArray(data) ? data : (data.data || data.results || []);
                renderGrid(searchResults);
            } catch (error) {
                console.error('Error saat pencarian:', error);
                animeGrid.innerHTML = `<p class="col-span-full text-center text-red-400 py-10">Pencarian gagal dilakukan.</p>`;
                hideLoading();
            }
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        }

        // 4. Load Detail Anime & Stream Player
        async function loadDetail(endpoint) {
            if (!endpoint) return;
            showLoading();

            try {
                const response = await fetch(`${API_BASE}/detail/${endpoint}`);
                const data = await response.json();
                const anime = data.data || data;

                document.getElementById('animeTitle').textContent = anime.title || 'Detail Anime';
                document.getElementById('animeSynopsis').textContent = anime.synopsis || anime.description || 'Tidak ada sinopsis.';

                // Embed Video / Player
                const videoIframe = document.getElementById('videoPlayer');
                if (anime.stream_url || anime.streamLink) {
                    videoIframe.src = anime.stream_url || anime.streamLink;
                } else {
                    videoIframe.src = 'about:blank';
                }

                // Render Daftar Episode
                const epListContainer = document.getElementById('episodeList');
                epListContainer.innerHTML = '';

                const episodes = anime.episodes || anime.episode_list || [];
                if (episodes.length > 0) {
                    episodes.forEach((ep, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'px-3 py-1.5 bg-slate-800 hover:bg-brand-600 text-xs font-semibold rounded border border-slate-700 transition-colors';
                        btn.textContent = ep.title || `Ep ${index + 1}`;
                        btn.onclick = () => {
                            if (ep.stream_url || ep.link) {
                                videoIframe.src = ep.stream_url || ep.link;
                            }
                        };
                        epListContainer.appendChild(btn);
                    });
                } else {
                    epListContainer.innerHTML = `<p class="text-xs text-slate-500">Tidak ada daftar episode tersedia.</p>`;
                }

                // Tampilkan Tampilan Detail
                animeGrid.classList.add('hidden');
                detailView.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                sectionTitle.innerHTML = `<i class="fa-solid fa-circle-play text-brand-500"></i> Memutar Anime`;

            } catch (error) {
                console.error('Gagal memuat detail:', error);
                alert('Gagal memuat detail anime.');
            } finally {
                hideLoading();
            }
        }

        // Helpers untuk Navigasi & Tampilan State
        function showHome() {
            detailView.classList.add('hidden');
            document.getElementById('videoPlayer').src = ''; // stop video
            document.getElementById('searchInput').value = '';
            backBtn.classList.add('hidden');
            sectionTitle.innerHTML = `<i class="fa-solid fa-fire text-brand-500"></i> Anime Terbaru`;
            fetchLatestAnime();
        }

        function showLoading() {
            loading.classList.remove('hidden');
            animeGrid.classList.add('hidden');
            detailView.classList.add('hidden');
        }

        function hideLoading() {
            loading.classList.add('hidden');
            if (detailView.classList.contains('hidden')) {
                animeGrid.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
