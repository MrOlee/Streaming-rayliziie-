<script>
(function(){
  'use strict';

  const ANILIST_API = 'https://graphql.anilist.co';

  // DIRECT RELIABLE STREAMS (CORS-SAFE & STABLE CDN)
  const HIGH_QUALITY_STREAMS = [
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',
    'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4'
  ];

  // STATE APLIKASI
  let currentAnime = null;
  let currentEp = 1;
  let currentRes = 'main';
  let isCinemaOn = false;
  let hlsInstance = null;

  const $ = id => document.getElementById(id);

  // MANAJEMEN GRAPHQL ANILIST
  async function fetchAniList(query, variables = {}) {
    try {
      const response = await fetch(ANILIST_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      const data = await response.json();
      return data.data;
    } catch (e) {
      return null;
    }
  }

  // QUERY KATALOG
  const QUERY_TRENDING = `
    query {
      Page(page: 1, perPage: 18) {
        media(type: ANIME, sort: TRENDING_DESC, isAdult: false) {
          id
          title { romaji english }
          coverImage { extraLarge }
          bannerImage
          episodes
          nextAiringEpisode { episode }
        }
      }
    }
  `;

  const QUERY_SEARCH = `
    query ($search: String) {
      Page(page: 1, perPage: 18) {
        media(type: ANIME, search: $search, isAdult: false) {
          id
          title { romaji english }
          coverImage { extraLarge }
          bannerImage
          episodes
          nextAiringEpisode { episode }
        }
      }
    }
  `;

  // PEMUATAN KATALOG
  async function loadCatalog(searchKeyword = '') {
    $('catalogGrid').innerHTML = '<p style="color:#a0a0a0;">Memuat daftar anime...</p>';
    const query = searchKeyword ? QUERY_SEARCH : QUERY_TRENDING;
    const vars = searchKeyword ? { search: searchKeyword } : {};
    
    const res = await fetchAniList(query, vars);
    const list = res?.Page?.media || [];
    
    $('catalogGrid').innerHTML = '';
    if (!list.length) {
      $('catalogGrid').innerHTML = '<p style="color:#a0a0a0;">Anime tidak ditemukan.</p>';
      return;
    }

    list.forEach(anime => {
      const card = document.createElement('div');
      card.className = 'anime-card';
      const title = anime.title.english || anime.title.romaji;
      card.innerHTML = `
        <img src="${anime.coverImage.extraLarge}" alt="${title}" />
        <div class="p-info">
          <div class="p-title">${title}</div>
        </div>
      `;
      card.onclick = () => openPlayerPage(anime, 1);
      $('catalogGrid').appendChild(card);
    });
  }

  function makeSlug(str) {
    return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  }

  // SISTEM MULTI-SERVER STREAMING
  function loadVideoSource(anime, ep, res, autoStart = false) {
    const videoEl = $('nativePlayer');
    const iframeEl = $('iframePlayer');
    const loader = $('playerLoader');
    const playOverlay = $('playOverlay');
    const errorBox = $('playerError');

    errorBox.style.display = 'none';

    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }

    const posterUrl = anime.bannerImage || anime.coverImage?.extraLarge || '';
    if (posterUrl) videoEl.poster = posterUrl;

    if (res === 'main') {
      // Server Utama Direct MP4 / HLS Stream
      iframeEl.style.display = 'none';
      iframeEl.src = 'about:blank';
      videoEl.style.display = 'block';

      const index = Math.abs((anime.id || 0) + ep) % HIGH_QUALITY_STREAMS.length;
      videoEl.src = HIGH_QUALITY_STREAMS[index];

      videoEl.onerror = () => {
        loader.style.display = 'none';
        errorBox.style.display = 'flex';
      };

      if (autoStart) {
        playOverlay.style.display = 'none';
        loader.style.display = 'flex';
        videoEl.onloadeddata = () => { loader.style.display = 'none'; };
        videoEl.play().catch(() => { 
          loader.style.display = 'none'; 
        });
      } else {
        playOverlay.style.display = 'flex';
        loader.style.display = 'none';
      }
    } else {
      // Mirror Servers Iframe
      playOverlay.style.display = 'none';
      loader.style.display = 'flex';
      videoEl.pause();
      videoEl.style.display = 'none';
      iframeEl.style.display = 'block';

      const slug = makeSlug(anime.title.english || anime.title.romaji);
      const serverMap = {
        '720': `https://vidsrc.su/embed/anime/${anime.id}/${ep}`,
        '480': `https://player.autoembed.cc/embed/anime/${anime.id}/${ep}`,
        '360': `https://anime.vidsrc.vip/embed/anime/${anime.id}/${ep}`,
        'alt': `https://vidsrc.pro/embed/anime/${anime.id}/${ep}`
      };

      iframeEl.src = serverMap[res] || serverMap['720'];
      
      const timer = setTimeout(() => { loader.style.display = 'none'; }, 1200);
      iframeEl.onload = () => { clearTimeout(timer); loader.style.display = 'none'; };
    }
  }

  // BUKA HALAMAN PLAYER
  function openPlayerPage(anime, ep) {
    currentAnime = anime;
    currentEp = ep;
    
    const title = anime.title.english || anime.title.romaji;
    const totalEp = anime.nextAiringEpisode?.episode ? (anime.nextAiringEpisode.episode - 1) : (anime.episodes || 12);

    // Update Judul Header
    $('epHeaderTitle').textContent = `${title} Episode ${ep} Subtitle Indonesia`;

    // Update Dropdown Episode
    const select = $('selectEpisode');
    select.innerHTML = '<option value="">Pilih Episode Lainnya</option>';
    for (let i = 1; i <= totalEp; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${title} Episode ${i}`;
      if (i === ep) opt.selected = true;
      select.appendChild(opt);
    }

    // Update Grid Tombol Episode
    const btnContainer = $('epButtonsContainer');
    btnContainer.innerHTML = '';
    for (let i = 1; i <= totalEp; i++) {
      const btn = document.createElement('button');
      btn.className = `ep-btn-item ${i === ep ? 'active' : ''}`;
      btn.textContent = `Eps ${i}`;
      btn.onclick = () => openPlayerPage(anime, i);
      btnContainer.appendChild(btn);
    }

    // Load Stream
    loadVideoSource(anime, ep, currentRes, false);

    // Beralih Halaman
    $('catalogPage').style.display = 'none';
    $('playerPage').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // EVENT LISTENERS
  $('playOverlay').onclick = () => {
    $('playOverlay').style.display = 'none';
    if (currentAnime) {
      loadVideoSource(currentAnime, currentEp, currentRes, true);
    }
  };

  $('btnSwitchServer').onclick = () => {
    // Switch to alternate mirror
    const servers = ['main', '720', '480', '360', 'alt'];
    let nextIdx = (servers.indexOf(currentRes) + 1) % servers.length;
    currentRes = servers[nextIdx];

    document.querySelectorAll('.btn-mirror').forEach(b => {
      b.classList.toggle('active', b.dataset.res === currentRes);
    });

    if (currentAnime) {
      loadVideoSource(currentAnime, currentEp, currentRes, true);
    }
  };

  $('selectEpisode').addEventListener('change', (e) => {
    const val = parseInt(e.target.value);
    if (val && currentAnime) {
      openPlayerPage(currentAnime, val);
    }
  });

  $('btnPrevEp').onclick = () => {
    if (currentAnime && currentEp > 1) {
      openPlayerPage(currentAnime, currentEp - 1);
    }
  };

  $('btnNextEp').onclick = () => {
    const totalEp = currentAnime?.nextAiringEpisode?.episode ? (currentAnime.nextAiringEpisode.episode - 1) : (currentAnime?.episodes || 12);
    if (currentAnime && currentEp < totalEp) {
      openPlayerPage(currentAnime, currentEp + 1);
    }
  };

  $('btnAllEp').onclick = () => {
    const el = $('epListGrid');
    el.scrollIntoView({ behavior: 'smooth' });
  };

  // CINEMA MODE TOGGLE
  $('btnCinema').onclick = () => {
    isCinemaOn = !isCinemaOn;
    document.body.classList.toggle('cinema-active', isCinemaOn);
    $('btnCinema').textContent = isCinemaOn ? 'CINEMA ON' : 'CINEMA OFF';
  };

  $('cinemaOverlay').onclick = () => {
    isCinemaOn = false;
    document.body.classList.remove('cinema-active');
    $('btnCinema').textContent = 'CINEMA OFF';
  };

  // BERALIH TAB RESOLUSI / MIRROR
  document.querySelectorAll('.btn-mirror').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.btn-mirror').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRes = btn.dataset.res;
      if (currentAnime) {
        loadVideoSource(currentAnime, currentEp, currentRes, true);
      }
    };
  });

  // NAVIGASI KEMBALI
  const resetToCatalog = () => {
    const videoEl = $('nativePlayer');
    videoEl.pause();
    if (hlsInstance) hlsInstance.destroy();

    $('playerPage').classList.remove('active');
    $('catalogPage').style.display = 'block';
    $('iframePlayer').src = 'about:blank';
  };

  $('btnBackCatalog').onclick = resetToCatalog;
  $('navHome').onclick = (e) => { e.preventDefault(); resetToCatalog(); };

  // PENCARIAN ANIME
  let searchTimer;
  $('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(() => {
      resetToCatalog();
      $('catalogTitle').innerHTML = q ? `<i class="fas fa-search"></i> Hasil Pencarian: "${q}"` : `<i class="fas fa-fire" style="color: #ef4444;"></i> Anime Trending`;
      loadCatalog(q);
    }, 500);
  });

  // INISIALISASI
  loadCatalog();

})();
</script>
</body>
</html>
