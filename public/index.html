<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Anime & Drama</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>🎬 AnimeStreaming</h1>
  </header>

  <main>
    <div id="anime-grid" class="grid">
      <p class="loading">Memuat data...</p>
    </div>
  </main>

  <script>
    async function loadCatalog() {
      try {
        const res = await fetch('/api/list?page=1');
        const result = await res.json();
        
        const grid = document.getElementById('anime-grid');
        grid.innerHTML = '';

        // Sesuaikan key json sesuai struktur response asli dari API indocast
        const items = result.data || result.items || result;

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${item.cover || item.poster || '/assets/cover1.jpg'}" alt="${item.title || item.name}">
            <h3>${item.title || item.name}</h3>
            <a href="/watch.html?id=${item.id}&path=${item.detailPath || ''}" class="btn">Tonton</a>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        document.getElementById('anime-grid').innerHTML = '<p>Gagal memuat katalog.</p>';
      }
    }

    loadCatalog();
  </script>
</body>
</html>
