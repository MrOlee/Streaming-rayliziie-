<script>
  async function loadCatalog() {
    const grid = document.getElementById('anime-grid');
    try {
      const res = await fetch('/api/list?page=1');
      const result = await res.json();
      
      // Jika terjadi error dari backend serverless
      if (!res.ok) {
        grid.innerHTML = `<p style="color: #ff4d4d;">Error Backend: ${result.error || res.statusText}</p>`;
        return;
      }

      grid.innerHTML = '';

      // Menyesuaikan berbagai kemungkinan format array dari Indocast API
      const items = result.data?.list || result.data || result.items || (Array.isArray(result) ? result : []);

      if (items.length === 0) {
        grid.innerHTML = `<p>Data tidak ditemukan atau format API berbeda.</p>`;
        console.log("Raw Response API:", result);
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // Pembacaan nama properti fleksibel
        const title = item.title || item.name || item.bookName || 'Tanpa Judul';
        const cover = item.cover || item.coverUrl || item.poster || item.img || '/assets/cover1.jpg';
        const id = item.id || item.bookId || '';
        const path = item.detailPath || item.slug || '';

        card.innerHTML = `
          <img src="${cover}" alt="${title}">
          <h3>${title}</h3>
          <a href="/watch.html?id=${id}&path=${encodeURIComponent(path)}" class="btn">Tonton</a>
        `;
        grid.appendChild(card);
      });
    } catch (err) {
      console.error("Fetch Error:", err);
      grid.innerHTML = `<p style="color: #ff4d4d;">Gagal memuat katalog: ${err.message}</p>`;
    }
  }

  loadCatalog();
</script>
