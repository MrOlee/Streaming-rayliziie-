<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rayliziie Anime - Streaming Anime & Drama Sub Indo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col">

  <!-- Header / Navbar -->
  <header class="border-b border-gray-800 bg-gray-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <a href="/" class="text-2xl font-black text-red-500 tracking-wider flex items-center gap-2">
        <span>RAYLIZIIE</span><span class="text-white font-light">ANIME</span>
      </a>
      
      <form onsubmit="handleSearch(event)" class="w-full sm:w-80 flex gap-2">
        <input id="searchInput" type="text" placeholder="Cari anime / drama Sub Indo..." 
          class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-red-500 transition">
        <button type="submit" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
          Cari
        </button>
      </form>
    </div>
  </header>

  <!-- Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="flex items-center justify-between mb-6">
      <h2 id="sectionTitle" class="text-xl font-bold border-l-4 border-red-500 pl-3">Episode Terbaru</h2>
    </div>

    <!-- Grid Anime -->
    <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
      <div class="col-span-full text-center py-20 text-gray-400">Memuat data dari server...</div>
    </div>
  </main>

  <footer class="border-t border-gray-800 bg-gray-900 py-6 text-center text-xs text-gray-500">
    &copy; 2026 Rayliziie Anime - Powered by Indocast API
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
