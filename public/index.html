<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Anime & Drama</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
    header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #334155; }
    header h1 { font-size: 24px; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; }
    .card img { width: 100%; height: 230px; object-fit: cover; background-color: #334155; }
    .card-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { font-size: 14px; margin-bottom: 10px; color: #f1f5f9; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .btn { display: block; text-align: center; background: #0284c7; color: #ffffff; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; }
    .btn:hover { background: #0369a1; }
    .status-msg { text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 16px; color: #94a3b8; }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Anime & Drama Streaming</h1>
  </header>

  <main>
    <div id="anime-grid" class="grid">
      <div class="status-msg">⏳ Memuat katalog anime...</div>
    </div>
  </main>

  <script>
    async function loadCatalog() {
      const grid = document.getElementById('anime-grid');
      try {
        const res = await fetch('/api/list?page=1');
        const result = await res.json();
        
        if (!res.ok) {
          grid.innerHTML = `<div class="status-msg error-msg">❌ Serverless Error (${res.status}): ${result.error || 'Gagal terhubung ke API Proxy'}</div>`;
          return;
        }

        const items = result.data?.list || result.data || result.items || (Array.isArray(result) ? result : []);

        if (!items || items.length === 0) {
          grid.innerHTML = `<div class="status-msg">📭 Data tidak ditemukan dari server API.</div>`;
          return;
        }

        grid.innerHTML = '';
        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          
          const title = item.title || item.name || item.bookName || 'Tanpa Judul';
          const cover = item.cover || item.coverUrl || item.poster || item.img || 'https://via.placeholder.com/200x300?text=No+Cover';
          const id = item.id || item.bookId || '';
          const path = item.detailPath || item.slug || '';

          card.innerHTML = `
            <img src="${cover}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
            <div class="card-content">
              <h3>${title}</h3>
              <a href="/watch.html?id=${id}&path=${encodeURIComponent(path)}" class="btn">▶ Tonton</a>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = `<div class="status-msg error-msg">⚠️ Terjadi kesalahan JavaScript: ${err.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadCatalog);
  </script>
</body>
</html>
