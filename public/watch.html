<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Anime</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/">⬅️ Kembali ke Katalog</a>
  </header>

  <main>
    <div class="player-container">
      <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    <h2 id="title">Loading...</h2>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const path = urlParams.get('path');

    async function loadVideo() {
      if (!id) return;
      try {
        const res = await fetch(`/api/play?id=${id}&se=1&ep=1&detailPath=${path}`);
        const data = await res.json();

        // Ambil URL stream/embed dari response API
        const videoUrl = data.playUrl || data.url || data.embed || '';
        if (videoUrl) {
          document.getElementById('video-player').src = videoUrl;
        } else {
          alert('Link video tidak ditemukan');
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadVideo();
  </script>
</body>
</html>
