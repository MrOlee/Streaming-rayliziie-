<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Anime - Rayliziie</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col">

  <header class="border-b border-gray-800 bg-gray-900 px-6 py-4">
    <a href="/" class="text-sm font-semibold text-red-500 hover:text-red-400 transition flex items-center gap-1">
      &larr; Kembali ke Beranda
    </a>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
    <h1 id="animeTitle" class="text-xl md:text-2xl font-bold mb-4 text-white">Memuat Video...</h1>

    <!-- Video Container -->
    <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl mb-6 border border-gray-800">
      <iframe id="videoPlayer" class="w-full h-full" allowfullscreen frameborder="0"></iframe>
    </div>

    <!-- Episode & Metadata Section -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-gray-900 p-5 rounded-xl border border-gray-800">
        <h3 class="text-base font-semibold mb-3 border-b border-gray-800 pb-2">Informasi</h3>
        <p id="synopsis" class="text-xs text-gray-400 leading-relaxed">Sipnosis tidak tersedia.</p>
      </div>

      <div class="bg-gray-900 p-5 rounded-xl border border-gray-800">
        <h3 class="text-base font-semibold mb-3 border-b border-gray-800 pb-2">Daftar Episode</h3>
        <div id="episodeList" class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-60 overflow-y-auto pr-1">
          <span class="col-span-full text-xs text-gray-500 py-2">Memuat episode...</span>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/watch.js"></script>
</body>
</html>
