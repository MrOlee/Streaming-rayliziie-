<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail & Nonton Anime</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/" class="back-btn">⬅️ Kembali ke Katalog</a>
  </header>

  <main class="container">
    <!-- Player Video -->
    <div class="player-wrapper">
      <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- Informasi Detail Anime -->
    <div class="info-section">
      <h1 id="anime-title">Memuat judul...</h1>
      <p id="anime-desc" class="desc">Memuat deskripsi...</p>
    </div>

    <!-- Pilihan Episode -->
    <div class="episodes-section">
      <h3>Daftar Episode</h3>
      <div id="episodes-list" class="episodes-grid">
        <p>Memuat daftar episode...</p>
      </div>
    </div>
  </main>

  <script src="/js/watch.js"></script>
</body>
</html>
